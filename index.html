<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fixaa AI Chat</title>
    <style>
        /* ستايل شركة فيكساا عرب - Matte Black & Cinematic */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 400px;
            height: 500px;
            background: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message { padding: 10px; border-radius: 10px; max-width: 80%; }
        .user { background: #333; align-self: flex-start; }
        .ai { background: #0056b3; align-self: flex-end; }
        #input-area { display: flex; padding: 15px; background: #181818; gap: 10px; }
        input {
            flex: 1;
            background: #252525;
            border: none;
            padding: 10px;
            border-radius: 5px;
            color: white;
            outline: none;
        }
        button {
            background: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #666; }
    </style>
</head>
<body>
    <h2>Fixaa AI 🤖</h2>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="userInput" placeholder="اسأل جيمناي...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
